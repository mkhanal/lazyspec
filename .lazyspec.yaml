# Where this repository's own requirements live, and what one is for.
# lazyspec is pointed at itself.

sets:
  - root: .
    specs: specs/*.lazyspec.md
    covers: |
      What lazyspec ships, where that shipped writing is load-bearing.
      A requirement here describes something a consumer's repository
      would notice if it changed: the shape of a specification, the
      size and content of the standing instruction.

      Not the skills. Those are prose, rewritten freely, and a
      requirement about their wording would be a requirement about
      style.

# sandbox/demo is a throwaway consumer repository, rebuilt on every run
# and gitignored. Its specifications are not part of the set above: they
# prove things about the tool, not about this repository.
