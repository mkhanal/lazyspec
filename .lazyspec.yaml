# Where this repository's own requirements live. lazyspec is pointed at
# itself: the tool is one hook and some writing, so the hook is what
# there is to specify.

sets:
  - root: .
    specs: specs/*.lazyspec.md

# example/ carries a specification and its married test as a fixture -
# three files showing the shape. It is locked like any other, but it is
# not part of the set above: it proves nothing about this tool.
